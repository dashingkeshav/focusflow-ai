<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 60" fill="none">
  <!-- Wordmark Typography: Focus in white, Flow in #FF4500 -->
  <g transform="translate(10, 42)">
    <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
          font-weight="800" font-size="34" fill="#FFFFFF" letter-spacing="-0.5px">Focus</text>
    
    <text x="96" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
          font-weight="800" font-size="34" fill="#FF4500" letter-spacing="-0.5px">Flow</text>

    <!-- AI Agent Pill / Circle Badge -->
    <g transform="translate(182, -26)">
      <rect width="86" height="26" rx="13" fill="#FF4500" fill-opacity="0.1" stroke="#FF4500" stroke-opacity="0.35" stroke-width="1.2"/>
      <text x="43" y="17" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
            font-size="10.5" font-weight="700" fill="#FF4500" letter-spacing="0.8px">AI AGENT</text>
    </g>
  </g>
</svg>
